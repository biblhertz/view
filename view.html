<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHMPI Viewer</title>
    <script src="https://unpkg.com/mirador@latest/dist/mirador.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&family=Libre+Baskerville:ital@1&display=swap">
    <link rel="icon" type="image/svg+xml" href="/hub/favicon.svg">
    <style>
        :root { --bh-header-h: 56px; }

        body {
            margin: 0;
            padding: 0;
        }

        /* ── Site header ─────────────────────────────────────────────────────
           Mirrors the header section of hub/bhr.css. bhr.css itself is NOT
           linked here: its bare "header", "nav" and "*" rules would hit
           Mirador, whose window top bar is an MUI AppBar (a <header>).
           Everything is therefore scoped to #bh-header. */
        #bh-header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--bh-header-h);
            z-index: 10000;                 /* above Mirador and the ⬇ button */
            display: flex; align-items: stretch;
            padding: 0 2.5rem;
            box-sizing: border-box;
            background: #0d2046;
            box-shadow: 0 2px 12px rgba(0,0,0,.35);
            font-family: 'Libre Franklin', sans-serif;
        }
        #bh-header .logo-slot {
            display: flex; align-items: center;
            min-width: 220px;
            margin-right: 2rem; padding-right: 2rem;
            border-right: 1px solid rgba(255,255,255,.12);
            text-decoration: none;
        }
        #bh-header .logo-slot img { filter: brightness(0) invert(1); margin-right: 1.25rem; }
        #bh-header .logo-name {
            display: block;
            font-weight: 700; font-size: .78rem; letter-spacing: .08em;
            text-transform: uppercase; line-height: 1.2;
            color: rgba(255,255,255,.95);
        }
        #bh-header .logo-sub {
            display: block;
            font-family: 'Libre Baskerville', serif; font-style: italic;
            font-size: .72rem; letter-spacing: .02em; line-height: 1.35;
            color: rgba(255,255,255,.5);
        }
        #bh-header nav { display: flex; align-items: center; gap: .25rem; flex: 1; }
        #bh-header nav a {
            display: flex; align-items: center;
            height: var(--bh-header-h);
            padding: 0 1rem;
            box-sizing: border-box;
            color: rgba(255,255,255,.6);
            text-decoration: none;
            font-size: .75rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
            border-bottom: 3px solid transparent;
            transition: color .15s, border-color .15s;
        }
        #bh-header nav a:hover { color: #fff; border-color: rgba(255,255,255,.3); }

        @media (max-width: 768px) {
            :root { --bh-header-h: 48px; }
            #bh-header { padding: 0 1rem; }
            #bh-header .logo-slot div { display: none; }
            #bh-header .logo-slot { min-width: 0; border-right: none; margin-right: 0; padding-right: .75rem; }
            #bh-header nav { gap: 0; }
            #bh-header nav a { padding: 0 .6rem; font-size: .68rem; letter-spacing: .06em; }
        }

        #viewer {
            position: absolute;
            top: var(--bh-header-h);
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* Mirador lays out its window with react-mosaic, whose stock CSS insets
           the root by 3px and gives each tile a 3px margin: the 6px frame
           around the window. Single fixed window here, so drop both. */
        #viewer .mosaic-root { top: 0 !important; right: 0 !important; bottom: 0 !important; left: 0 !important; }
        #viewer .mosaic-tile { margin: 0 !important; }

        /* Force pointer events on annotation containers and links */
        #viewer a,
        #viewer .mirador-third-party-html,
        #viewer .mirador-third-party-html * {
            pointer-events: auto !important;
            cursor: pointer !important;
        }
    </style>
</head>
<body>
<!-- byte-conform copy of:  https://viewer-f044f0.pages.mpcdf.de -->
<header id="bh-header">
    <a class="logo-slot" href="https://www.biblhertz.it">
        <img src="/hub/bhmpi.svg" alt="Bibliotheca Hertziana" height="32">
        <div>
            <span class="logo-name">Bibliotheca Hertziana</span>
            <span class="logo-sub">Max-Planck-Institut für Kunstgeschichte</span>
        </div>
    </a>
    <nav>
        <a href="/hub/ocr-index">Volumes</a>
<!--        <a href="/hub/index">Map</a>-->
    </nav>
</header>
<div id="viewer"></div>

<script type="text/javascript">
    var urlParams = new URLSearchParams(window.location.search);
    var manifestUrl = urlParams.get('manifest');
    var itemParam = urlParams.get('item');
    var canvasParam = urlParams.get('canvas');
    var viewParam = urlParams.get('view');
    var displayParam = urlParams.get('display');

    // uncomment ONLY for testing, must be commented for production!
    //itemParam = 'ab816400078'

    // Build manifest URL from item parameter if manifest not provided
    // Beware the manifest2 fixed string - this should be changed in the future.
    if (!manifestUrl && itemParam) {
        manifestUrl = 'https://dlib.biblhertz.it/iiif/' + itemParam + '/manifest2.json';
    }

    if (!manifestUrl) {
        document.getElementById('viewer').innerHTML = '<h1 style="font-family:Roboto,sans-serif;padding:2rem;">Error: No manifest or item provided</h1>';
    } else {
        var windowConfig = {
            loadedManifest: manifestUrl
        };

        // Construct canvas ID if canvas parameter provided
        if (canvasParam) {
            // Extract object ID from manifest URL (e.g., dm5055800)
            var objectMatch = manifestUrl.match(/iiif\/(?:2\/)?([^\/]+)\//);
            if (objectMatch) {
                var objectId = objectMatch[1];
                var paddedCanvas = canvasParam.toString().padStart(4, '0');
                var canvasId = 'https://dlib2.biblhertz.it/iiif/2/' + objectId + '@' + paddedCanvas + '-canvas';
                windowConfig.canvasId = canvasId;
            }
        }

        // Determine sidebar configuration from view parameter
        var sideBarOpen = true;
        var sideBarPanel = 'info'; // default

        if (viewParam) {
            // Valid panels: info, attribution, annotations, canvas
            var validPanels = ['info', 'attribution', 'annotations', 'canvas'];
            if (viewParam === 'none' || viewParam === 'closed') {
                sideBarOpen = false;
            } else if (validPanels.indexOf(viewParam) !== -1) {
                sideBarPanel = viewParam;
            }
        }

        var mirador = Mirador.viewer({
            id: "viewer",
            windows: [windowConfig],
            thumbnailNavigation: {
                defaultPosition: 'far-right'
            },
            workspaceControlPanel: {
                enabled: false,
            },
            window: {
                sideBarOpen: sideBarOpen,
                sideBarPanel: sideBarPanel,
                defaultSidebarPanelWidth: 350,
                allowClose: false,
                allowMaximize: false,
                allowFullscreen: true,
                allowTopMenuButton: true,
                allowWindowSideBar: true,
                view: displayParam || 'single',
                panels: {
                    info: true,
                    attribution: true,
                    annotations: true,
                    canvas: true,
                    search: false,
                    layers: false,
                },
                thumbnailNavigation: {
                    height: 130,
                    width: 100
                }
            },
            requests: {
                preprocessors: []
            },
            "osdConfig": {
                "showNavigator": true
            },
            "workspace": {
                "showZoomControls": true
            },
            "windowOptions": {
                "imageToolsEnabled": true,
                "imageToolsOpen": false
            },
            themes: {
                dark: {
                    palette: {
                        type: 'dark',
                        primary: {
                            main: '#1e3f7a',
                        },
                        secondary: {
                            main: '#1e3f7a',
                        }
                    }
                },
                light: {
                    palette: {
                        type: 'light',
                        primary: {
                            main: '#1e3f7a',
                        },
                        secondary: {
                            main: '#1e3f7a',
                        }
                    }
                },
            },
        });

// Define store FIRST
        var store = mirador.store;

        var lastViewport = null;
        var viewportUpdateTimeout;
        var allowUrlUpdates = false;

// Target viewport from URL
        var targetX = urlParams.get('x');
        var targetY = urlParams.get('y');
        var targetZoom = urlParams.get('z');
        var targetDisplay = urlParams.get('display');

// Wait for viewport to stabilize, then force it to URL values
        setTimeout(function() {
            var stableCheckCount = 0;
            var lastCheckedViewport = null;

            var stabilityCheck = setInterval(function() {
                var state = store.getState();
                var windowIds = Object.keys(state.windows);

                if (windowIds.length > 0 && state.viewers[windowIds[0]]) {
                    var viewerState = state.viewers[windowIds[0]];
                    var currentCheck = viewerState.x + ',' + viewerState.y + ',' + viewerState.zoom;

                    if (currentCheck === lastCheckedViewport) {
                        stableCheckCount++;
                        if (stableCheckCount >= 2) {
                            clearInterval(stabilityCheck);

                            // Force the view mode first
                            if (targetDisplay) {
                                store.dispatch({
                                    type: 'mirador/SET_WINDOW_VIEW_TYPE',
                                    windowId: windowIds[0],
                                    viewType: targetDisplay
                                });
                                console.log('Forced view mode to:', targetDisplay);
                            }

                            // NOW force the viewport to URL parameters
                            if (targetX && targetY && targetZoom) {
                                store.dispatch({
                                    type: 'mirador/UPDATE_VIEWPORT',
                                    windowId: windowIds[0],
                                    payload: {
                                        x: parseFloat(targetX),
                                        y: parseFloat(targetY),
                                        zoom: parseFloat(targetZoom) / 1000
                                    }
                                });
                                console.log('Forced viewport to URL values:', targetX, targetY, targetZoom);
                            }

                            // Enable URL updates after a brief delay
                            setTimeout(function() {
                                allowUrlUpdates = true;
                                console.log('URL updates enabled');
                            }, 400);
                        }
                    } else {
                        stableCheckCount = 0;
                        lastCheckedViewport = currentCheck;
                    }
                }
            }, 200);
        }, 1200);

        store.subscribe(function() {
            if (!allowUrlUpdates) return;

            var state = store.getState();
            var windowIds = Object.keys(state.windows);

            if (windowIds.length > 0) {
                var windowId = windowIds[0];
                var viewerState = state.viewers[windowId];
                var windowState = state.windows[windowId];

                if (viewerState && windowState) {
                    var currentViewport = viewerState.x + ',' + viewerState.y + ',' + viewerState.zoom + ',' + windowState.view;

                    if (currentViewport !== lastViewport) {
                        lastViewport = currentViewport;

                        clearTimeout(viewportUpdateTimeout);
                        viewportUpdateTimeout = setTimeout(function() {
                            var newUrlParams = new URLSearchParams(window.location.search);
                            newUrlParams.set('x', '' + Math.round(Number(viewerState.x)));
                            newUrlParams.set('y', '' + Math.round(Number(viewerState.y)));
                            newUrlParams.set('z', (Number(viewerState.zoom) * 1000).toFixed(3));

                            // Use targetDisplay if it was in original URL, otherwise use current state
                            var displayValue = targetDisplay || windowState.view || 'book';
                            newUrlParams.set('display', displayValue);

                            // Clear targetDisplay after first update so subsequent changes work
                            // if (targetDisplay) {
                            //     targetDisplay = null;
                            // }

                            var newUrl = window.location.pathname + '?' + newUrlParams.toString();
                            window.history.replaceState(null, '', newUrl);
                        }, 500);
                    }
                }
            }
        });
// To restore viewport on load, dispatch an action to Mirador
        setTimeout(function() {
            var x = urlParams.get('x');
            var y = urlParams.get('y');
            var zoom = urlParams.get('z');

            if (x && y && zoom) {
                var windowIds = Object.keys(store.getState().windows);
                if (windowIds.length > 0) {
                    store.dispatch({
                        type: 'mirador/UPDATE_VIEWPORT',
                        windowId: windowIds[0],
                        payload: {
                            x: parseFloat(x),
                            y: parseFloat(y),
                            zoom: parseFloat(zoom) / 1000  // divide by 1000
                        }
                    });
                }
            }
        }, 1000);

        // Listen for canvas changes and update URL
        var currentCanvasId = null;
        store.subscribe(function () {
            var state = store.getState();
            var windowIds = Object.keys(state.windows);

            if (windowIds.length > 0) {
                var firstWindowId = windowIds[0];
                var canvasId = state.windows[firstWindowId].canvasId;

                if (canvasId && canvasId !== currentCanvasId) {
                    currentCanvasId = canvasId;

                    var canvasMatch = canvasId.match(/@(\d+)-canvas/);
                    if (canvasMatch) {
                        var canvasNumber = parseInt(canvasMatch[1], 10);

                        var newUrlParams = new URLSearchParams(window.location.search);
                        newUrlParams.set('canvas', canvasNumber);

                        // ADD THIS: preserve display mode
                        var windowState = state.windows[firstWindowId];
                        if (windowState && windowState.view) {
                            newUrlParams.set('display', windowState.view);
                        } else {
                            newUrlParams.set('display', 'book');
                        }

                        var newUrl = window.location.pathname + '?' + newUrlParams.toString();
                        window.history.pushState(null, '', newUrl);
                    }
                }
            }
        });

        // Add custom download button
        var downloadButton = document.createElement('button');
        downloadButton.innerHTML = '⬇';
        downloadButton.setAttribute('aria-label', 'Download current image');
        downloadButton.setAttribute('aria-haspopup', 'true');
        downloadButton.setAttribute('title', 'Switch to single view to download');
        downloadButton.setAttribute('type', 'button');
        downloadButton.style.cssText =
            'position: fixed; top: calc(var(--bh-header-h) + 16px); right: 130px; z-index: 9999; padding: 1px 3px; background: transparent; color: gray; border: 2px solid gray; cursor: pointer; font-family: Roboto, sans-serif; font-size: 13px; display: block;';

        function updateDownloadButtonState(view) {
            if (view === 'single') {
                downloadButton.style.color = '#1e3f7a';
                downloadButton.style.borderColor = '#1e3f7a';
                downloadButton.setAttribute('title', 'Download current image');
            } else {
                downloadButton.style.color = 'gray';
                downloadButton.style.borderColor = 'gray';
                downloadButton.setAttribute('title', 'Switch to single view to download');
            }
        }

        downloadButton.addEventListener('click', function() {
            var state = store.getState();
            var windowIds = Object.keys(state.windows);
            if (windowIds.length === 0) return;

            var windowId = windowIds[0];
            var view = state.windows[windowId].view;

            if (view !== 'single') {
                // First click: switch to single view
                store.dispatch({
                    type: 'mirador/SET_WINDOW_VIEW_TYPE',
                    windowId: windowId,
                    viewType: 'single'
                });
            } else {
                // Second click (already in single): download
                var canvasId = state.windows[windowId].canvasId;
                if (!canvasId) { return; }
                var canvasMatch = canvasId.match(/@(\d+)-canvas/);
                if (canvasMatch) {
                    var canvasNumber = canvasMatch[1];
                    var objectMatch = manifestUrl.match(/iiif\/(?:2\/)?([^\/]+)\//);
                    if (objectMatch) {
                        var objectId = objectMatch[1];
                        // Use native size if both dimensions <= 4000px, otherwise fit within 4000x4000 box
                        var sizeParam = '!4000,4000';  // safe default: fit within box, preserve aspect ratio
                        try {
                            var canvases = state.manifests[manifestUrl].json.sequences[0].canvases;
                            var canvasData = canvases.find(function(c) { return c['@id'] === canvasId; });
                            if (canvasData && canvasData.width && canvasData.height &&
                                canvasData.width <= 4000 && canvasData.height <= 4000) {
                                sizeParam = 'full';  // native size, no scaling needed
                            }
                        } catch(e) { /* fall through to !4000,4000 default */ }

                        var downloadUrl = 'https://dlib2.biblhertz.it/iiif/2/' + objectId + '@' + canvasNumber + '.jp2/full/' + sizeParam + '/0/default.jpg';
                        window.open(downloadUrl, '_blank');
                    }
                }
            }
        });

        document.body.appendChild(downloadButton);

        // Update button appearance based on view mode (button always visible)
        store.subscribe(function() {
            var state = store.getState();
            var windowIds = Object.keys(state.windows);
            if (windowIds.length > 0) {
                var view = state.windows[windowIds[0]].view;
                updateDownloadButtonState(view);
            }
        });

        // Use mousedown instead of click (Mirador blocks click events)
        document.addEventListener('mousedown', function (e) {
            if (!document.getElementById('viewer').contains(e.target)) return;  // header links behave normally
            var target = e.target;
            while (target && target !== document) {
                if (target.tagName === 'A' && target.href) {
                    e.stopPropagation();
                    e.preventDefault();
                    window.open(target.href, target.target || '_blank');
                    return false;
                }
                target = target.parentElement;
            }
        }, true);
    }

    // setTimeout(function() {
    //     var x = urlParams.get('x');
    //     var y = urlParams.get('y');
    //     var zoom = urlParams.get('z');
    //
    //     console.log('URL params:', x, y, zoom);
    //
    //     if (x && y && zoom) {
    //         var windowIds = Object.keys(store.getState().windows);
    //         if (windowIds.length > 0) {
    //             console.log('Before dispatch - viewer state:', store.getState().viewers[windowIds[0]]);
    //
    //             store.dispatch({
    //                 type: 'mirador/UPDATE_VIEWPORT',
    //                 windowId: windowIds[0],
    //                 payload: {
    //                     x: parseFloat(x),
    //                     y: parseFloat(y),
    //                     zoom: parseFloat(zoom) / 1000
    //                 }
    //             });
    //
    //             setTimeout(function() {
    //                 console.log('After dispatch - viewer state:', store.getState().viewers[windowIds[0]]);
    //             }, 100);
    //         }
    //     }
    // }, 1000);
</script>
</body>
</html>
